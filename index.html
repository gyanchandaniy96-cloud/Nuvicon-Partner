<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14191c">
<title>Nuvicon Partner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#ECEAE4;--card:#fff;--ink:#14191c;--mut:#667078;--line:#d6d3cb;--acc:#F2B705;--ok:#2f7d4f;--bad:#b3392f;--dark:#14191c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:76px}
main{max-width:620px;margin:0 auto;padding:0 14px}
.top{background:var(--dark);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top b{letter-spacing:.12em;font-size:15px}.top small{color:var(--acc);margin-left:6px}
.top button{background:transparent;border:1px solid #444;color:#ddd;border-radius:6px;padding:5px 10px;font-size:13px}
h1{font-size:22px;margin:16px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}
small,.mut{color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;background:#e4e2db}
.pill.staged{background:var(--acc)}.pill.picked_up,.pill.in_transit{background:#cfe6d8;color:#1f5a38}.pill.delivered{background:#bfe0cc;color:#1f5a38}.pill.cod{background:#f8e3b5;color:#a85f00}
.btn{border:0;border-radius:6px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--acc);color:var(--ink);width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);width:auto;padding:8px 12px;font-size:14px}.btn:disabled{opacity:.4}
.btn.dark{background:var(--dark);color:#fff}
a.btn{display:inline-block;text-align:center;text-decoration:none;width:auto;padding:8px 12px;font-size:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink);margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:14px 0;border:0;background:transparent;color:var(--mut);font-weight:600;font-size:14px}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
.items{margin:8px 0;padding:8px;background:#f6f5f1;border-radius:6px;font-size:14px}
.err{color:var(--bad);font-size:13px;margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px}.stat b{display:block;font-size:20px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div>
<script>var DLG=null;
function dlgOpen(msg,mode,def){return new Promise(function(res){
 if(DLG){DLG.remove();DLG=null}
 var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(20,25,28,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px";
 var c=document.createElement("div");c.style.cssText="background:#fff;border-radius:12px;padding:18px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.3)";
 var t=document.createElement("div");t.style.cssText="white-space:pre-wrap;font-size:15px;margin-bottom:12px";t.textContent=msg;c.appendChild(t);
 var inp=null;if(mode==="ask"){inp=document.createElement("input");inp.value=def==null?"":String(def);inp.style.cssText="width:100%;margin-bottom:12px";c.appendChild(inp)}
 var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;justify-content:flex-end";
 var done=function(v){o.remove();DLG=null;res(v)};
 if(mode!=="alert"){var cb=document.createElement("button");cb.className="btn ghost";cb.textContent="Cancel";cb.onclick=function(){done(mode==="ask"?null:false)};row.appendChild(cb)}
 var ob=document.createElement("button");ob.className="btn";ob.textContent="OK";ob.onclick=function(){done(mode==="ask"?inp.value:true)};row.appendChild(ob);
 c.appendChild(row);o.appendChild(c);document.body.appendChild(o);DLG=o;
 if(inp){inp.focus();inp.select();inp.onkeydown=function(e){if(e.key==="Enter")ob.click()}}else ob.focus()})}
function ask(msg,def){return dlgOpen(msg,"ask",def)}
function conf(msg){return dlgOpen(msg,"conf")}
function showAlert(msg){dlgOpen(String(msg),"alert")}

var U="https://ptbaxvqvwhgowflxzqmh.supabase.co",K="sb_publishable_QeRuu6oa6UKMuPTaIjgLcg_BuX-n2dI";
var sb=window.supabase.createClient(U,K);
var LBL={placed:"Being prepared",staged:"Ready for pickup",picked_up:"Picked up",in_transit:"On the way",delivered:"Delivered"};
var NEXT={staged:["picked_up","Picked up"],picked_up:["in_transit","On the way"],in_transit:["delivered","Delivered"]};
var S={city:"",user:null,me:null,boot:true,step:"phone",phone:"",otp:"",err:"",busy:false,tab:"active",orders:[],sum:null,loadErr:""};
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function fmt(n){return "₹"+Math.round(Number(n)).toLocaleString("en-IN")}
function toast(m){var t=document.getElementById("toast");t.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(function(){t.innerHTML=""},2500)}
function dt(s){return new Date(s).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}
async function whoami(){
 var r=await sb.auth.getSession();
 if(!r.data.session){S.user=null;S.me=null;S.boot=false;return render()}
 S.user=r.data.session.user;
 var m=await sb.rpc("my_partner");S.me=m.data||null;S.boot=false;
 try{var cc=await sb.from("settings").select("value").eq("key","city").maybeSingle();if(cc.data&&cc.data.value)S.city=String(cc.data.value)}catch(x){}
 if(S.me&&S.me.status==="approved"&&S.me.active)await load();
 render()}
async function load(){
 var o=await sb.rpc("partner_orders"),s=await sb.rpc("partner_summary");
 if(o.error){S.loadErr=o.error.message}else{S.orders=o.data||[];S.loadErr=""}
 if(s.data)S.sum=s.data}
function orderCard(o){
 var tkg=(o.items||[]).reduce(function(a,i){return a+(Number(i.wt_kg)||0)},0),nx=NEXT[o.status],items=(o.items||[]).map(function(i){return esc(i.qty)+" × "+esc(i.name)+" ("+esc(i.label)+")"+(i.wt_kg?" [approx. "+Math.round(i.wt_kg)+" kg]":"")}).join("<br>");
 var cod=o.pay_method==="on_delivery";
 var map=(o.delivery_lat!=null)?"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+o.delivery_lat+","+o.delivery_lng:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((o.address||"")+", "+o.zone+", "+S.city);
 return '<div class="card"><div class="flex"><div><b>#'+esc(o.order_no)+'</b> <span class="pill '+o.status+'">'+esc(LBL[o.status]||o.status)+'</span><br><small>'+esc(o.zone)+', '+dt(o.created_at)+'</small></div><b>'+fmt(o.total)+'</b></div>'+
 '<div class="items">'+items+(tkg>0?'<br><b>Total steel weight: approx. '+Math.round(tkg)+' kg</b>':'')+'</div>'+
 '<div><small>Customer: <b>'+esc(o.customer_name||"")+'</b> +'+esc(o.customer_phone)+'<br>Area: '+esc(o.zone||"-")+'<br>Address: '+esc(o.address||"-")+'</small></div>'+(o.distance_km!=null?'<div style="margin-top:6px"><b>'+esc(o.distance_km)+' km from the godown</b></div>':'')+
 (cod&&o.status!=="delivered"?'<div style="margin-top:6px"><span class="pill cod">COD</span> <b>'+fmt(o.total)+'</b> <small>collect from customer</small></div>':'')+
 (o.pay_method==="credit"&&o.status!=="delivered"?'<div style="margin-top:6px"><small><b>Credit order.</b> Do not collect money from the customer.</small></div>':'')+
 (o.status==="delivered"?'<div style="margin-top:6px"><small>Fee '+fmt(o.partner_fee||0)+(o.cod_collected!=null?', COD collected '+fmt(o.cod_collected):'')+'</small></div>':'')+
 (o.status!=="delivered"?'<div class="row"><a class="btn" href="tel:+'+esc(o.customer_phone)+'">Call</a><a class="btn" target="_blank" rel="noopener" href="'+map+'">Directions (Map)</a></div>':'')+
 (nx?'<div style="margin-top:10px"><button class="btn'+(nx[0]==="delivered"?' dark':'')+'" data-a="st" data-id="'+o.id+'" data-s="'+nx[0]+'">'+esc(nx[1])+'</button></div>':'')+
 (o.status==="placed"?'<div style="margin-top:8px"><small>The order is being prepared at the store. The button appears here as soon as it is ready.</small></div>':'')+'</div>'}
function homeV(){
 var act=S.orders.filter(function(o){return o.status!=="delivered"}),done=S.orders.filter(function(o){return o.status==="delivered"});
 var list=S.tab==="active"?act:done;
 return '<h1>'+(S.tab==="active"?'My orders':'Completed (3 days)')+'</h1>'+(S.loadErr?'<div class="err">'+esc(S.loadErr)+'</div>':'')+(list.length?list.map(orderCard).join(""):'<div class="empty">'+(S.tab==="active"?'No orders assigned yet.':'Nothing yet.')+'</div>')}
function earnV(){
 var s=S.sum||{deliveries:0,fee:0,cod:0};
 return '<h1>This month</h1><div class="stat"><div><small>Deliveries</small><b>'+s.deliveries+'</b></div><div><small>Fee</small><b>'+fmt(s.fee)+'</b></div><div><small>COD collected</small><b>'+fmt(s.cod)+'</b></div></div><p class="mut"><small>COD cash must be deposited with Nuvicon. Fee settlement is done with the Nuvicon team.</small></p>'}
function msgV(t,d){return '<main><h1 style="margin-top:60px">'+t+'</h1><p class="mut">'+d+'</p><button class="btn ghost" data-a="out">Log out</button></main>'}
function loginV(){
 return '<main><h1 style="margin-top:60px">Nuvicon Partner</h1><p class="mut">Delivery partner login</p>'+
 (S.step==="phone"?'<input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" value="'+esc(S.phone)+'"><button class="btn" data-a="send"'+(S.busy?' disabled':'')+'>Send code</button>':
 '<input id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="6-digit code" value="'+esc(S.otp)+'"><button class="btn" data-a="verify"'+(S.busy?' disabled':'')+'>Verify</button><div style="margin-top:8px"><button class="btn ghost" data-a="back">Change number</button></div>')+
 (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+'</main>'}
function render(){
 var a=document.getElementById("app"),n=document.getElementById("nav");n.innerHTML="";
 if(S.boot){a.innerHTML='<div class="empty">Loading…</div>';return}
 if(!S.user){a.innerHTML=loginV();return}
 if(!S.me){a.innerHTML=msgV("No partner account","This number is not linked to a delivery partner. Ask the Nuvicon team to add your number.");return}
 if(S.me.status==="pending"){a.innerHTML=msgV("Approval pending","Your account is waiting for the Nuvicon team to approve it.");return}
 if(S.me.status==="suspended"||!S.me.active){a.innerHTML=msgV("Account suspended","Please contact the Nuvicon team.");return}
 a.innerHTML='<div class="top"><div><b>NUVICON</b><small>PARTNER</small></div><div><small style="color:#aaa">'+esc(S.me.name)+'</small> <button data-a="out">Log out</button></div></div><main>'+(S.tab==="earn"?earnV():homeV())+'</main>';
 n.innerHTML=[["active","Orders"],["done","Completed"],["earn","Earnings"]].map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-a="tab" data-id="'+t[0]+'">'+t[1]+'</button>'}).join("")}
document.addEventListener("click",async function(e){
 var b=e.target.closest("[data-a]");if(!b||b.disabled||b.tagName==="A")return;
 var a=b.dataset.a,id=b.dataset.id,y=window.scrollY;S.err="";
 if(a==="tab")S.tab=id;
 else if(a==="back"){S.step="phone";S.otp=""}
 else if(a==="out"){await sb.auth.signOut();S.user=null;S.me=null;S.orders=[]}
 else if(a==="send"){
  if(!/^[6-9][0-9]{9}$/.test(S.phone))S.err="Enter a valid 10-digit number.";
  else{S.busy=true;render();var r=await sb.auth.signInWithOtp({phone:"+91"+S.phone});S.busy=false;if(r.error)S.err=r.error.message;else S.step="otp"}}
 else if(a==="verify"){
  S.busy=true;render();var r2=await sb.auth.verifyOtp({phone:"+91"+S.phone,token:S.otp,type:"sms"});S.busy=false;
  if(r2.error)S.err=r2.error.message;else{S.step="phone";S.otp="";S.boot=true;render();return whoami()}}
 else if(a==="st"){
  var s=b.dataset.s,o=S.orders.find(function(x){return String(x.id)===String(id)}),cod=null;
  if(s==="delivered"){
   if(o.pay_method==="on_delivery"){
    var v=await ask("How much did you collect from the customer? (Total "+fmt(o.total)+")",Math.round(o.total));if(v===null)return;cod=parseFloat(v);
    if(!(cod>=0)){showAlert("Enter a valid amount");return}
    if(cod<o.total&&!await conf("Total "+fmt(o.total)+", you entered "+fmt(cod)+". Are you sure?"))return}
   else if(!await conf("Mark as delivered?"))return}
  b.disabled=true;
  var r3=await sb.rpc("partner_set_status",{p_order:+id,p_status:s,p_cod:cod});
  if(r3.error)showAlert(r3.error.message);else toast("Updated");
  await load()}
 render();window.scrollTo(0,y)});
document.addEventListener("input",function(e){var i=e.target.id;
 if(i==="phone")S.phone=e.target.value.replace(/\D/g,"");else if(i==="otp")S.otp=e.target.value.replace(/\D/g,"")});
setInterval(function(){if(S.user&&S.me&&S.me.status==="approved"&&!document.hidden){load().then(render)}},20000);
render();whoami();
</script></body></html>
